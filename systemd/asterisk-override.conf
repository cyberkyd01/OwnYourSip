# Installed as /etc/systemd/system/asterisk.service.d/override.conf
#
# Trade-off: Debian runs Asterisk as the unprivileged "asterisk" user. chan_mobile
# needs raw Bluetooth (RFCOMM/SCO) sockets and chan_dongle/chan_quectel need the
# USB serial devices, which appear with changing owners/groups. Running Asterisk
# as root is the simplest reliable way to get all of these on an appliance, at the
# cost of weaker isolation if Asterisk is compromised. The box is a single-purpose
# appliance, so we accept that.
[Unit]
After=bluetooth-hf.service

[Service]
ExecStart=
ExecStart=/usr/sbin/asterisk -g -f -p -U root -G root
SupplementaryGroups=dialout bluetooth

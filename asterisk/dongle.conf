; chan_dongle (wdoekes/asterisk-chan-dongle)
[general]
interval=15

[defaults]
context=from-trunk-unknown
group=0
rxgain=0
txgain=0
autodeletesms=yes
resetdongle=yes
u2diag=-1
usecallingpres=yes
callingpres=allowed_passed_screen
disablesms=no
language=en
smsaspdu=yes
mindtmfgap=45
mindtmfduration=80
mindtmfinterval=200
callwaiting=auto
disable=no
initstate=start
exten=+1234567890
dtmf=relax

#include dongle_gen.conf

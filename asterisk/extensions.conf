; pi-sip-gateway base dialplan. Contexts below are generated by the web app
; into extensions_gen.conf: [internal-ext], [outbound-routes], [from-trunk-*],
; [inbound-*], [from-trunk-unknown].
;
; Note: Asterisk matches a context's own extensions before its includes, and
; includes in order. So the catch-all lives in its own context, included last,
; otherwise it would shadow every outbound route.
[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

[from-internal]
include => internal-ext
include => outbound-routes
include => no-route

[no-route]
exten => _X.,1,NoOp(No route for ${EXTEN})
 same => n,Playback(check-number-dial-again)
 same => n,Hangup()
exten => _+X.,1,NoOp(No route for ${EXTEN})
 same => n,Playback(check-number-dial-again)
 same => n,Hangup()

#include extensions_gen.conf
